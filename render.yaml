services:
  - type: web
    name: skillnexus-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port     envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillnexus-db
          property: connectionString

databases:
  - name: skillnexus-db
    databaseName: skillnexus
    user: skillnexus
    plan: free
